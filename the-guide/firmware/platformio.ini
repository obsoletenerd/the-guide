; The Guide — Xteink X3 firmware. PlatformIO Core (CLI only — see
; ../../hardware/xteink-x3/PLAN.md #3 for why PlatformIO, not ESP-IDF/arduino-cli).
;
; Reuses freeink-sdk (MIT) as local libraries via symlink — the checked-out
; submodule under crosspoint-reader/, not a re-clone. See PLAN.md #1 for the
; hardware this targets and #6 for the phase this env exists to build.

[env:guide_x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; No PSRAM on the C3 — freeink-sdk's display driver must use one framebuffer,
  ; not the double-buffer path (see hardware/xteink-x3/PLAN.md #2).
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; X3 only — this firmware doesn't need the X3/X4 dual-profile runtime switch
  ; CrossPoint carries for its shared binary.
  -DFREEINK_DEVICE_X3=1
  ; X3's battery telemetry is the BQ27220 I2C fuel gauge, not an ADC pin --
  ; see BatteryMonitor.h. X3 also carries a DS3231 RTC (BoardConfig sensors).
  -DFREEINK_BATTERY_I2C_GAUGE=1
  -DFREEINK_CAP_RTC=1
  -std=gnu++2a
build_unflags =
  -std=gnu++11

; Local libraries: the freeink-sdk submodule checked out under crosspoint-reader/,
; symlinked in place (not copied) so it stays in sync with that checkout.
lib_deps =
  BoardConfig=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/hardware/BoardConfig
  InputManager=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/hardware/InputManager
  EInkDisplay=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/display/FreeInkDisplay
  FreeInkUI=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/ui/FreeInkUI
  ; SdFat-over-SPI, shared with the display's SPI bus (Phase X1). SDCardManager's
  ; own library.json declares greiman/SdFat as a dependency; PlatformIO's LDF
  ; resolves it from the registry automatically -- no need to list it ourselves.
  SDCardManager=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/hardware/SDCardManager
  ; Phase X4: deep-sleep / GPIO3 wake-on-power-button, SoC-portable (RISC-V
  ; gpio-wakeup vs Xtensa ext1) -- see PowerManager.h.
  PowerManager=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/hardware/PowerManager
  ; Top-bar battery %/clock: BQ27220 gauge + DS3231 RTC, both over the same
  ; I2C bus (BoardConfig sensors/batteryGauge pins).
  BatteryMonitor=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/hardware/BatteryMonitor
  Rtc=symlink://../../hardware/xteink-x3/crosspoint-reader/freeink-sdk-566fce3d4fe45fdcf76853be788e4d497547b592/libs/hardware/Rtc
